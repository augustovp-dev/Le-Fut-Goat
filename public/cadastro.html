<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<link rel="icon" href="./assets/favicon2.jpg">
<script src="./js/sessao.js" defer></script>
<link rel="stylesheet" href="cssHeader.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #000000, #000000);
    padding-top: 70px;
}

.login-container {
    display: flex;
    height: calc(100vh - 70px);
}

.login-left {
    flex: 1;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
}

.login-left h2 {
    font-size: 2.5em;
}

.login-right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.campo {
    margin-bottom: 15px;
}

.campo input {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.campo input:focus {
    outline: none;
    border-color: #355391;
    box-shadow: 0 0 5px rgba(53,83,145,0.5);
}

.botao {
    width: 100%;
    padding: 12px;
    background-color: #EB0D3F;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.botao:hover {
    background-color: #000000;
}

.card_erro {
    display: none;
    background-color: green;
    color: white;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
    text-align: center;
}
footer {
    background-color: #EB0D3F;
    color: white;
    margin-top: 40px;
}

.footer-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 15px;
    flex-wrap: wrap;
    text-align: center;
}

.footer-container p {
    margin: 0;
}
</style>
</head>

<body>
<header>
    <h1>Le' Fut Goat</h1>
    <nav id="navLinks">
        <a href="minhaHistória.html">Minha<br>História<br>no Futebol</a>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="login-container">
    <div class="login-left">
        <h2>Crie sua conta</h2>
        <p>Comece agora sua jornada no futebol.</p>
    </div>

    <div class="login-right">
        <div class="card">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>

            <h2>Bem-vindo!</h2>

            <div class="formulario">
                <div class="campo">
                    <span>Nome:</span>
                    <input id="nome_input" type="text" placeholder="Seu nome">
                </div>

                <div class="campo">
                    <span>Email:</span>
                    <input id="email_input" type="text" placeholder="meuemail@provedor.com">
                </div>

                <div class="campo">
                    <span>Senha:</span>
                    <input id="senha_input" type="password" placeholder="***********">
                </div>

                <div class="campo">
                    <span>Confirmar senha:</span>
                    <input id="confirmacao_senha_input" type="password" placeholder="***********">
                </div>

                <button class="botao" onclick="cadastrar()" id="btnCadastro" type="button">Cadastrar</button>
                <div id="div_aguardar" class="loading-div"></div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-container">
        <p>Contato: (11) 93900-9825</p>
        <p>Email: avp.augustovpassos@gmail.com</p>
        <p>2026 Le' Fut Goat</p>
    </div>
</footer>

<script>
function validarEmail(email) {
    var arroba = email.indexOf("@");
    var ponto = email.lastIndexOf(".");

    return arroba > 0 && ponto > arroba + 1 && ponto < email.length - 1;
}

function cadastrar() {
    var nomeVar = document.getElementById("nome_input").value.trim();
    var emailVar = document.getElementById("email_input").value.trim();
    var senhaVar = document.getElementById("senha_input").value;
    var confirmacaoSenhaVar = document.getElementById("confirmacao_senha_input").value;

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
        mostrarMensagem("Preencha todos os campos.");
        return false;
    }

    if (nomeVar.length < 2) {
        mostrarMensagem("Informe um nome válido.");
        return false;
    }

    if (!validarEmail(emailVar)) {
        mostrarMensagem("Informe um email válido.");
        return false;
    }

    if (senhaVar.length < 6) {
        mostrarMensagem("A senha precisa ter pelo menos 6 caracteres.");
        return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
        mostrarMensagem("As senhas não conferem.");
        return false;
    }

    aguardar();

    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })
    .then(function (resposta) {
        finalizarAguardar();

        if (resposta.ok) {
            mostrarMensagem("Cadastro realizado.");
            setTimeout(function () {
                window.location = "login.html";
            }, 1200);
            return;
        }

        resposta.text().then(function (texto) {
            mostrarMensagem(texto);
        });
    })
    .catch(function () {
        finalizarAguardar("Não foi possível cadastrar agora.");
    });

    return false;
}
</script>
</body>
</html>
